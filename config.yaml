{
  "paths": {
    "raw_dataset_dir": "dataset",
    "processed_dir": "data/processed",
    "outputs_dir": "outputs"
  },
  "image_size": 224,
  "batch_size": 16,
  "learning_rate": 0.0001,
  "epochs": 20,
  "early_stopping_patience": 5,
  "early_stopping_min_delta": 0.0001,
  "random_seed": 42,
  "split": {
    "train": 0.70,
    "validation": 0.15,
    "test": 0.15
  },
  "num_workers": 2,
  "device": "auto",
  "normalization": {
    "mean": [0.485, 0.456, 0.406],
    "std": [0.229, 0.224, 0.225]
  },
  "augmentation": {
    "enabled": true,
    "horizontal_flip_probability": 0.5,
    "rotation_degrees": 10,
    "translate": [0.05, 0.05],
    "scale": [0.95, 1.05],
    "brightness": 0.05,
    "contrast": 0.05
  },
  "mri": {
    "imbalance_strategy": "weighted_loss",
    "weighted_sampling": false
  }
}
